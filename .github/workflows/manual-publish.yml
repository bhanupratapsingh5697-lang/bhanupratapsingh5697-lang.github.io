
name: Manual News Publisher

on:
  workflow_dispatch:
    inputs:
      title:
        description: "News headline"
        required: true
        type: string
      category:
        description: "News category"
        required: true
        type: choice
        options:
          - India
          - Rajasthan
          - World
          - Sports
          - Technology
          - Education
      language:
        description: "Article language"
        required: true
        type: choice
        options:
          - en
          - hi
      article:
        description: "Full article text. Separate paragraphs with blank lines."
        required: true
        type: string
      image:
        description: "Image URL (optional)"
        required: false
        type: string
      source_name:
        description: "Source name (optional)"
        required: false
        type: string
      source_url:
        description: "Original source URL (optional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: manual-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create news article
        env:
          NEWS_TITLE: ${{ inputs.title }}
          NEWS_CATEGORY: ${{ inputs.category }}
          NEWS_LANGUAGE: ${{ inputs.language }}
          NEWS_ARTICLE: ${{ inputs.article }}
          NEWS_IMAGE: ${{ inputs.image }}
          NEWS_SOURCE_NAME: ${{ inputs.source_name }}
          NEWS_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          title = os.environ["NEWS_TITLE"].strip()
          article = os.environ["NEWS_ARTICLE"].strip()

          if not title or not article:
              raise SystemExit("Headline and article are required.")

          now = datetime.now(ZoneInfo("Asia/Kolkata"))

          slug = re.sub(r"[^a-z0-9]+", "-", title.lower())
          slug = slug.strip("-")[:70].strip("-") or "manual-news"

          posts = Path("_posts")
          posts.mkdir(exist_ok=True)

          path = posts / f"{now:%Y-%m-%d}-{slug}.md"

          if path.exists():
              path = posts / f"{now:%Y-%m-%d-%H%M%S}-{slug}.md"

          category = os.environ["NEWS_CATEGORY"]
          language = os.environ["NEWS_LANGUAGE"]
          image = os.environ.get("NEWS_IMAGE", "").strip()
          source_name = os.environ.get("NEWS_SOURCE_NAME", "").strip()
          source_url = os.environ.get("NEWS_SOURCE_URL", "").strip()

          lines = [
              "---",
              "layout: post",
              f"title: {json.dumps(title, ensure_ascii=False)}",
              f"date: {now.strftime('%Y-%m-%d %H:%M:%S %z')}",
              f"category: {json.dumps(category)}",
              f"lang: {json.dumps(language)}",
              'author: "Today News Desk"',
              f"image: {json.dumps(image or '/assets/images/news-default.svg', ensure_ascii=False)}",
          ]

          if source_name:
              lines.append(
                  f"source_name: {json.dumps(source_name, ensure_ascii=False)}"
              )

          if source_url:
              lines.append(f"source_url: {json.dumps(source_url, ensure_ascii=False)}")

          lines.extend(["---", "", article, ""])

          path.write_text("\n".join(lines), encoding="utf-8")
          print(f"Created article: {path}")
          PY

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git commit -m "news: publish manual article"
          git pull --rebase origin main
          git push origin main
