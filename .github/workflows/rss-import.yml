
name: Import RSS news

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini package
        run: python -m pip install google-genai

      - name: Import latest RSS news
        env:
          GEMINI: ${{ secrets.GEMINI }}
        run: python scripts/import_rss.py

      - name: Commit new stories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/
          if git diff --cached --quiet; then
            echo "No new RSS stories."
          else
            git commit -m "chore: import latest RSS news"
            git push
          fi
